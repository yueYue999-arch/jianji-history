{name:"初见",line:"先从心动的地方出发"},{name:"相处",line:"看看你如何走近世界"},{name:"转弯",line:"变化里，藏着你的习惯"},{name:"归心",line:"把答案慢慢交还给自己"}],A=[{id:"exploration",label:"探新",low:"熟悉",high:"探新",meaning:"面对未知，你偏向打开新地图，还是深挖熟悉的风景。",highText:"新体验会点亮你。你愿意先留一点空间给未知，再看看它会长成什么。",lowText:"你知道熟悉也有深处。比起不断换地图，你更愿意把喜欢的地方走得更懂。",tipHigh:"探索之前，给试错留一个小预算。",tipLow:"在熟悉的日常里，只换一个小细节。"},{id:"planning",label:"谋定",low:"即兴",high:"谋定",meaning:"你如何对待安排：先搭一个框架，还是留白给现场。",highText:"你喜欢让事情有来处、有顺序。提前想好几步，会让你更安心地投入。",lowText:"你信任现场的反馈。安排留一点空，才装得下临时出现的好主意。",tipHigh:"计划里留一格空白，给意外一个位置。",tipLow:"挑一件重要的事，只定一个清楚的时间点。"},{id:"initiative",label:"先行",low:"蓄势",high:"先行",meaning:"想法出现以后，你偏向先做一小步，还是先把条件看清。",highText:"你会用一个小动作让事情开始。做出来的反馈，通常比空想更能给你方向。",lowText:"你愿意先观察和准备。真正决定动手时，往往已经想清自己在做什么。",tipHigh:"开始之后，顺手写下一个收尾标准。",tipLow:"把第一步缩到十分钟，试完再决定。"},{id:"autonomy",label:"自主",low:"协商",high:"自主",meaning:"当自己的判断与周围不同时，你会怎样作出选择。",highText:"你需要给自己的判断留位置。可以听建议，但最终希望由自己决定如何生活。",lowText:"你擅长把自己的想法放进关系里讨论。听见不同立场，能帮你找到共同的路。",tipHigh:"说出选择时，也说一句你愿意理解的部分。",tipLow:"商量之前，先写下自己最不想让步的一点。"},{id:"empathy",label:"共感",low:"务实",high:"共感",meaning:"遇见他人的困扰，你通常先回应心情，还是先寻找办法。",highText:"你容易先听见话背后的心情。被认真理解，对你来说也是解决问题的一部分。",lowText:"你常把关心落在具体办法上。让眼前的事情变轻一点，就是你熟悉的支持方式。",tipHigh:"陪伴别人之后，给自己一点安静的时间。",tipLow:"给建议之前，先问一句：你更想被听见，还是一起想办法？"},{id:"connection",label:"联结",low:"独处",high:"联结",meaning:"当你需要补充能量，你更想与人相聚，还是给自己留空间。",highText:"与你信任的人交换一点生活，会让你重新有劲。关系是你认识世界的一条路。",lowText:"你需要不被打断的时段，让想法慢慢归位。独处是整理自己，不是拒绝别人。",tipHigh:"聚会之间，给自己留一段没有安排的时间。",tipLow:"挑一个安心的人，主动分享最近的一件小事。"},{id:"expression",label:"表达",low:"含蓄",high:"表达",meaning:"有了感受或想法，你倾向把它说出来，还是先放在心里。",highText:"你喜欢让想法走进交流。说出来、写下来，常常也让你更明白自己。",lowText:"你会先在心里把东西放一放。表达不一定很多，但你在意它是否准确、值得。",tipHigh:"说完自己的想法，留半分钟听听回应。",tipLow:"不必一次讲完整，先分享其中最小的一句。"},{id:"aesthetics",label:"意趣",low:"实用",high:"意趣",meaning:"挑选物件和记录生活时，你更在意气氛与意味，还是功能与方便。",highText:"颜色、光线和一句话的余味，都会影响你的选择。你愿意让日常多一点意味。",lowText:"你珍惜清楚、顺手、能用的东西。让生活少一点负担，本身就是一种审美。",tipHigh:"给喜欢的东西留位置，也给真正需要的东西留位置。",tipLow:"为一件每天使用的小物，挑一个你也喜欢的样子。"}],Yt=[{id:"q01",chapter:0,title:"没有攻略的夜晚",prompt:"你领到一张“城市漫游券”，只有今晚有效。第一站，你会怎么选？",primary:"exploration",secondary:"autonomy",options:[{id:"a",text:"独自钻进没去过的巷子，跟着自己的好奇走。",note:"你愿意独立走向未知。",scores:{exploration:2,autonomy:1}},{id:"b",text:"拉上朋友，一起找一家从没听说过的小店。",note:"和人一起探索，会让新鲜事更有意思。",scores:{exploration:2,autonomy:-1}},{id:"c",text:"一个人回到最喜欢的旧书店，慢慢逛。",note:"你珍惜自己认定的熟悉风景。",scores:{exploration:-2,autonomy:1}},{id:"d",text:"问问朋友想去哪，再约个大家熟悉的地方。",note:"你愿意让共同的节奏决定去处。",scores:{exploration:-2,autonomy:-1}}]},{id:"q02",chapter:0,title:"你来导演一场重逢",prompt:"好久不见的朋友要来了。如果由你安排这一天，你会？",primary:"planning",secondary:"empathy",options:[{id:"b",text:"先查好时间、位置和备选方案，把见面安排妥当。",note:"你会先用清楚的安排托住事情。",scores:{planning:2,empathy:-1}},{id:"c",text:"见面再看对方的心情，随时换个更舒服的安排。",note:"你愿意跟着当下的感受调整。",scores:{planning:-2,empathy:1}},{id:"d",text:"只定碰头的地点，其他等到了再说。",note:"你能给见面留出即兴的空间。",scores:{planning:-2,empathy:-1}},{id:"a",text:"先问对方最近想要什么，再认真安排路线。",note:"你的准备会把人的需要一起放进去。",scores:{planning:2,empathy:1}}]},{id:"q03",chapter:0,title:"一个听起来有点傻的点子",prompt:"你突然想到，可以把一个无聊的周末变成小型主题展。接下来更像你的是？",primary:"initiative",secondary:"connection",options:[{id:"c",text:"找朋友聊聊，等想法更完整了再开始。",note:"你愿意在交谈里慢慢酝酿。",scores:{initiative:-2,connection:1}},{id:"d",text:"先安静搜集素材，不急着动手。",note:"准备充分，会让你更容易投入。",scores:{initiative:-2,connection:-1}},{id:"a",text:"马上拉个小群，和朋友先搭一角看看。",note:"你会让行动和交流一起发生。",scores:{initiative:2,connection:1}},{id:"b",text:"先自己动手做出一个小样，再决定要不要继续。",note:"你习惯用自己的小实验启动事情。",scores:{initiative:2,connection:-1}}]},{id:"q04",chapter:0,title:"群聊里，你有另一个答案",prompt:"大家兴致勃勃地选好了活动，但它不太合你的心意。你通常会？",primary:"autonomy",secondary:"expression",options:[{id:"d",text:"先跟着大家试试，边参与边判断。",note:"你愿意先进入共同的节奏。",scores:{autonomy:-2,expression:-1}},{id:"a",text:"直接说出自己的偏好，必要时另作安排。",note:"你愿意让自己的判断被看见。",scores:{autonomy:2,expression:1}},{id:"b",text:"不展开解释，悄悄留一个适合自己的选择。",note:"你会安静地保留选择权。",scores:{autonomy:2,expression:-1}},{id:"c",text:"把想法说出来，再和大家商量一个共同方案。",note:"表达对你来说也可以是协调。",scores:{autonomy:-2,expression:1}}]},{id:"q05",chapter:0,title:"新家的那一角",prompt:"朋友的新家有一处空白角落，让你帮忙挑点东西。你先想到的是？",primary:"empathy",secondary:"aesthetics",options:[{id:"a",text:"一幅呼应他最近心情的小画，放在那里就很有感觉。",note:"你会把一个人的心情放进审美选择。",scores:{empathy:2,aesthetics:1}},{id:"b",text:"问清他真正缺什么，选一件能让日常轻松的东西。",note:"你把理解落实为实际的照顾。",scores:{empathy:2,aesthetics:-1}},{id:"c",text:"看看光线和配色，挑一个让空间变好看的物件。",note:"空间的气氛会吸引你的注意。",scores:{empathy:-2,aesthetics:1}},{id:"d",text:"量好位置，比较尺寸和用途，选个最顺手的。",note:"清楚好用，是你看重的价值。",scores:{empathy:-2,aesthetics:-1}}]},{id:"q06",chapter:0,title:"突然空出来的一天",prompt:"你在一座不熟悉的城市，多出了一天。怎样过，最能给你充电？",primary:"connection",secondary:"exploration",options:[{id:"b",text:"约上熟人，吃顿舒服的饭，聊些最近的事。",note:"安稳的相聚就足够珍贵。",scores:{connection:2,exploration:-1}},{id:"c",text:"自己走进陌生街区，看会遇见什么。",note:"你喜欢自己与未知相遇。",scores:{connection:-2,exploration:1}},{id:"d",text:"独自找个熟悉风格的地方，按舒服的节奏待着。",note:"独处和熟悉感能帮你恢复节奏。",scores:{connection:-2,exploration:-1}},{id:"a",text:"找当地人聊聊，跟他们去见没见过的东西。",note:"人和新鲜经验，会一起给你能量。",scores:{connection:2,exploration:1}}]},{id:"q07",chapter:1,title:"散场之后的那部电影",prompt:"一部电影让你回味很久，朋友问你“怎么样”。你会更想？",primary:"expression",secondary:"planning",options:[{id:"c",text:"先整理成一小段文字，有合适的时机再分享。",note:"你愿意先把感受整理好。",scores:{expression:-2,planning:1}},{id:"d",text:"让感受再待一会儿，暂时只说一句“值得看”。",note:"留白也是你的表达方式。",scores:{expression:-2,planning:-1}},{id:"a",text:"想好几个最打动你的点，再兴致勃勃地讲。",note:"你喜欢把表达准备得清楚又完整。",scores:{expression:2,planning:1}},{id:"b",text:"从脑海里冒出的第一个画面开始聊。",note:"交流本身会帮你找到想说的话。",scores:{expression:2,planning:-1}}]},{id:"q08",chapter:1,title:"给桌面一点新生活",prompt:"每天看着同一个角落，你想让它变得更舒服。你会怎么开始？",primary:"aesthetics",secondary:"initiative",options:[{id:"d",text:"先观察哪些东西真正常用，再决定如何整理。",note:"想清用途，比立刻改变更重要。",scores:{aesthetics:-2,initiative:-1}},{id:"a",text:"现在就换个灯光、摆一件喜欢的小物，看看气氛。",note:"你会直接动手，让生活多一点意趣。",scores:{aesthetics:2,initiative:1}},{id:"b",text:"慢慢收集配色和摆放灵感，等想好再改。",note:"你愿意花时间酝酿一个喜欢的样子。",scores:{aesthetics:2,initiative:-1}},{id:"c",text:"先把碍事的线和东西收好，马上顺手起来。",note:"你喜欢用小动作解决眼前的不便。",scores:{aesthetics:-2,initiative:1}}]},{id:"q09",chapter:1,title:"一张奇怪的邀请函",prompt:"书店邀请你参加一个六人小局，主题完全陌生。你更可能？",primary:"exploration",secondary:"connection",options:[{id:"a",text:"报名看看，认识几个和平时不一样的人。",note:"新知识和新相遇会同时吸引你。",scores:{exploration:2,connection:1}},{id:"b",text:"暂不参加，自己找本相关的冷门书试试。",note:"你愿意按自己的方式走近陌生领域。",scores:{exploration:2,connection:-1}},{id:"c",text:"另约老朋友，聊聊大家熟悉又喜欢的书。",note:"与你熟悉的人深聊，也很有吸引力。",scores:{exploration:-2,connection:1}},{id:"d",text:"重读一本自己喜欢的书，把这个晚上留给自己。",note:"熟悉的内容和独处都能让你满足。",scores:{exploration:-2,connection:-1}}]},{id:"q10",chapter:1,title:"突然被递来的话筒",prompt:"活动里，主持人忽然请你讲讲自己的作品。你更自然的反应是？",primary:"planning",secondary:"expression",options:[{id:"b",text:"整理好要点，交给主持人介绍，自己补充必要内容。",note:"你在意内容清楚，也保留自己的表达节奏。",scores:{planning:2,expression:-1}},{id:"c",text:"边讲边看大家的反应，即兴说出最鲜活的部分。",note:"现场的回应会点亮你的表达。",scores:{planning:-2,expression:1}},{id:"d",text:"留在原位，想到合适的内容再简短补一句。",note:"你能接受即兴，也不急着成为焦点。",scores:{planning:-2,expression:-1}},{id:"a",text:"快速列出三点，然后上台讲清楚。",note:"有一点结构，你就更愿意展开表达。",scores:{planning:2,expression:1}}]},{id:"q11",chapter:1,title:"喜欢的事，先做哪一版",prompt:"你想做一个自己的小作品。第一版，你倾向于？",primary:"initiative",secondary:"aesthetics",options:[{id:"c",text:"先想清风格、色彩和气氛，再慢慢做。",note:"你愿意为作品的气质留时间。",scores:{initiative:-2,aesthetics:1}},{id:"d",text:"先弄明白它解决什么问题，条件合适再开始。",note:"清楚用途，能帮你决定是否投入。",scores:{initiative:-2,aesthetics:-1}},{id:"a",text:"今天就做，让它先有一个能打动自己的样子。",note:"行动和审美会一起推动你。",scores:{initiative:2,aesthetics:1}},{id:"b",text:"今天先跑通最核心的用途，好看可以之后再调。",note:"你习惯先让事情真正运转。",scores:{initiative:2,aesthetics:-1}}]},{id:"q12",chapter:1,title:"那条大家都走的路",prompt:"熟悉的方法能完成任务，你却想到了另一个做法。你更倾向于？",primary:"autonomy",secondary:"exploration",options:[{id:"d",text:"沿用大家熟悉的流程，把配合先做好。",note:"共同的方法也能带来踏实感。",scores:{autonomy:-2,exploration:-1}},{id:"a",text:"按自己的判断，试一条新的路线。",note:"你愿意为自己的新判断试一次。",scores:{autonomy:2,exploration:1}},{id:"b",text:"保留自己的节奏，用验证过的办法做好。",note:"自主不一定意味着不断换方法。",scores:{autonomy:2,exploration:-1}},{id:"c",text:"和信任的人商量，再一起尝试新做法。",note:"你喜欢在共识中打开新可能。",scores:{autonomy:-2,exploration:1}}]},{id:"q13",chapter:2,title:"那句“我没事”",prompt:"朋友发来一句“没事，就是有点累”。你首先会怎样回应？",primary:"empathy",secondary:"planning",options:[{id:"a",text:"先问问他真正的感受，再约个时间好好聊。",note:"你会给情绪一个被认真安放的时间。",scores:{empathy:2,planning:1}},{id:"b",text:"顺着他此刻想说的话陪一会儿，不急着安排。",note:"你愿意让陪伴跟着对方的感受走。",scores:{empathy:2,planning:-1}},{id:"c",text:"一起把最近压着他的事列出来，看看怎么分担。",note:"你常用清楚的安排表达支持。",scores:{empathy:-2,planning:1}},{id:"d",text:"给一个眼下能试的小办法，再根据回应调整。",note:"你会从当下可行的帮助开始。",scores:{empathy:-2,planning:-1}}]},{id:"q14",chapter:2,title:"雨落在小市集上",prompt:"你和朋友的小摊刚摆好，忽然下雨了。你的第一反应更像？",primary:"connection",secondary:"initiative",options:[{id:"b",text:"先和伙伴商量位置与分工，再稳妥调整。",note:"共同想清楚，能让你更有把握。",scores:{connection:2,initiative:-1}},{id:"c",text:"先自己把最需要保护的东西安顿好。",note:"你倾向先独立处理最紧迫的一步。",scores:{connection:-2,initiative:1}},{id:"d",text:"观察一下雨势和周围空间，想清楚再动作。",note:"观察会帮你减少无用的忙乱。",scores:{connection:-2,initiative:-1}},{id:"a",text:"招呼旁边的人，一起立刻挪到能避雨的地方。",note:"你会把人和行动很快组织起来。",scores:{connection:2,initiative:1}}]},{id:"q15",chapter:2,title:"大家都在转的那句话",prompt:"一句流行的观点刷遍了你的首页，但你有点不同的看法。你会？",primary:"expression",secondary:"autonomy",options:[{id:"c",text:"先记下自己的判断，不急着公开解释。",note:"自己的理解，不一定需要立刻被看见。",scores:{expression:-2,autonomy:1}},{id:"d",text:"先多听一听大家为什么认同，再决定要不要说。",note:"你会先给不同的声音留位置。",scores:{expression:-2,autonomy:-1}},{id:"a",text:"公开写下自己的理解，欢迎别人来讨论。",note:"你愿意让独立判断进入交流。",scores:{expression:2,autonomy:1}},{id:"b",text:"把看法说出来，也听听能否找到共同点。",note:"你常把表达当作相互理解的机会。",scores:{expression:2,autonomy:-1}}]},{id:"q16",chapter:2,title:"把今天装进小盒子",prompt:"如果只能留下一样今天的东西，你更想留下？",primary:"aesthetics",secondary:"empathy",options:[{id:"d",text:"一份方便以后查找的清单、票据或记录。",note:"清楚可用的痕迹，能让你安心。",scores:{aesthetics:-2,empathy:-1}},{id:"a",text:"一个带着人情味的漂亮画面，看到就能想起当时。",note:"美感和情感，会一起决定你想珍藏什么。",scores:{aesthetics:2,empathy:1}},{id:"b",text:"一个光线和构图都很好的瞬间，不必有什么故事。",note:"画面本身就能给你意义。",scores:{aesthetics:2,empathy:-1}},{id:"c",text:"一段与重要的人有关的语音或实用备忘。",note:"你重视与人的联系，也在意记录能派上用场。",scores:{aesthetics:-2,empathy:1}}]},{id:"q17",chapter:2,title:"古城的四扇门",prompt:"暮色里，一座古城只剩一晚可以逛。你会怎样走完？",primary:"exploration",secondary:"planning",options:[{id:"a",text:"标好没去过的几个点，给未知排一条路线。",note:"你喜欢带着地图去冒险。",scores:{exploration:2,planning:1}},{id:"b",text:"挑一条陌生巷子，跟着当下的兴趣走。",note:"你愿意让未知自己展开。",scores:{exploration:2,planning:-1}},{id:"c",text:"按计划看看一直想重访的老地方。",note:"有准备地重逢，也是一种享受。",scores:{exploration:-2,planning:1}},{id:"d",text:"在熟悉的街区随意走走，遇见什么算什么。",note:"熟悉的风景里，你仍愿意即兴。",scores:{exploration:-2,planning:-1}}]},{id:"q18",chapter:2,title:"期待落空的晚餐",prompt:"惦记很久的店临时休息了。站在门口，你更可能？",primary:"planning",secondary:"initiative",options:[{id:"b",text:"先比较距离、等位和口味，想清楚再走。",note:"把条件看清楚，会让你更舒服。",scores:{planning:2,initiative:-1}},{id:"c",text:"看看附近哪家有意思，直接进去试试。",note:"你擅长先动起来，再接收反馈。",scores:{planning:-2,initiative:1}},{id:"d",text:"先不着急，在周围走走，再随兴决定。",note:"你不急着填满每一个空档。",scores:{planning:-2,initiative:-1}},{id:"a",text:"快速选好两个备选，马上去下一家。",note:"你能用一个小计划迅速接住变化。",scores:{planning:2,initiative:1}}]},{id:"q19",chapter:3,title:"那个一直没开始的爱好",prompt:"你终于有时间重启一个想了很久的爱好。你会？",primary:"initiative",secondary:"autonomy",options:[{id:"c",text:"按自己的目标慢慢准备，等状态合适再开始。",note:"你愿意按自己的节奏蓄力。",scores:{initiative:-2,autonomy:1}},{id:"d",text:"多请教几个人，确认适合的方式后再动手。",note:"共识和准备，会增加你的把握。",scores:{initiative:-2,autonomy:-1}},{id:"a",text:"自己选一个最想试的片段，今天就练起来。",note:"你能让自己的判断立刻变成一个动作。",scores:{initiative:2,autonomy:1}},{id:"b",text:"照着老师或朋友的建议，先完成一次练习。",note:"可信的建议能帮你迈出第一步。",scores:{initiative:2,autonomy:-1}}]},{id:"q20",chapter:3,title:"帮忙，还是先照顾自己",prompt:"你已经安排好独处的晚上，朋友忽然请你帮一件不紧急的事。你会？",primary:"autonomy",secondary:"empathy",options:[{id:"d",text:"一起协调一下，先把这件事处理妥当。",note:"协调与解决问题，是你熟悉的回应。",scores:{autonomy:-2,empathy:-1}},{id:"a",text:"先理解他的着急，再清楚说明今晚想留给自己。",note:"你会把体谅和自己的边界放在一起。",scores:{autonomy:2,empathy:1}},{id:"b",text:"说明自己的安排，给一个可行的替代时间。",note:"你倾向用清楚的安排守住边界。",scores:{autonomy:2,empathy:-1}},{id:"c",text:"先陪他把情绪和需要说清楚，再一起调整安排。",note:"人的感受会进入你的选择。",scores:{autonomy:-2,empathy:1}}]},{id:"q21",chapter:3,title:"角落里安静的人",prompt:"聚会里，有个人一直安静坐着。你更自然的做法是？",primary:"empathy",secondary:"connection",options:[{id:"a", 薛宝钗","《红楼梦》· 文学角色","把分寸放在心里的人","照顾周全，也给自己留个位置","衡","01001100","红楼一梦","这个原型取周全、协调与含蓄的一面，不给小说人物作道德排名，也不要求你处处照顾别人。","在为一件事作周全安排时，补上一条属于自己的需要。","薛宝钗是《红楼梦》中的文学角色。对人物的解读有多种角度，本原型只是一种原创文化阅读。","《红楼梦》第四十五回等","https://zh.wikisource.org/wiki/紅樓夢/第045回",[["planning","相处中的周全考虑，是这里采用的条理线索。"],["empathy","关照他人需要的情节，提供了体察的一面。"],["connection","在复杂关系里协调相处，连接共同商量的角度。"]]),F("shixiangyun","史湘云","《红楼梦》· 文学角色","把兴致带进相聚的人","有兴致的日子，不怕多一点笑声","酣","10100101","红楼一梦","这个原型取诗社与相聚中的兴味，让热闹和自己的审美可以自然地放在一起。","约一个人分享最近的小发现，也为聚会之后留一点休息。","史湘云是《红楼梦》中的文学角色。此处取诗社与宴游场景，不把某一情节当完整性格诊断。","《红楼梦》第六十二回等","https://zh.wikisource.org/wiki/紅樓夢/第062回",[["aesthetics","诗社与宴游的文学场景，为生活意趣提供了线索。"],["connection","相聚和同行，为这个原型带来关系中的兴致。"],["initiative","愿意投入眼前的活动，是这里采用的行动角度。"]]),F("tanchun","探春","《红楼梦》· 文学角色","能把一件事理顺的人","有想法，也愿意把它做成安排","理","01110010","红楼一梦","这个原型取理事与主张的一面，关注怎样让清楚的想法变成能够执行的小改变。","挑一个合作中的小堵点，写清谁做什么、何时完成。","探春是《红楼梦》中的文学角色。第五十六回等理事情节为本原型提供了文本线索。","《红楼梦》第五十六回","https://zh.wikisource.org/wiki/紅樓夢/第056回",[["planning","理事中的安排与分工，提供了结构线索。"],["initiative","推动具体调整，是此处采用的行动侧面。"],["autonomy","提出自己的主张，为独立判断提供了阅读角度。"]])];var Wt=[{id:"shenkuo",name:"沈括",era:"北宋",line:"把好奇，变成可追问的答案",title:"清醒的观察者",seal:"察",motif:"mountain",tags:["独立思考","细致求证","有序探索"],intro:"你不急着接受一个听起来顺耳的结论。先观察、拆开问题，再找一条能走通的路，是你熟悉的方式。好奇心在你这里，往往会长成一个具体的计划。",strength:"你擅长把“好像如此”推进到“为什么如此”。这份耐心，让新想法不只停在热闹的开头，也有机会成为经得起推敲的成果。",caution:"有时，等到所有疑问都被回答，开始的时机也过去了。你可以把准备分成“现在必需”和“做着再补”两部分。",action:"选一件一直在准备的小事，给它一个二十分钟就能完成的试验版本。",history:"沈括是北宋学者，《梦溪笔谈》保存了他对自然、技术与生活的广泛观察。",source:"《梦溪笔谈》；中国国家博物馆“沈括与《梦溪笔谈》”相关介绍",group:"求知与远行",direction:"11010000",vector:[82,82,32,82,32,32,32,32],anchors:[{dimension:"exploration",text:"《梦溪笔谈》里，细小的自然现象也值得认真追问。"},{dimension:"planning",text:"分门别类记录见闻，是把好奇变成条理的一种方式。"},{dimension:"autonomy",text:"独立观察与求证，是这个文化原型的核心。"}]},{id:"zhangqian",name:"张骞",era:"西汉",line:"你打开的路，也会成为别人的路",title:"有方向的开路者",seal:"通",motif:"mountain",tags:["目标清楚","愿意探索","善于联结"],intro:"你喜欢新的可能，也希望它能成为大家真正走得通的路。出发之前弄清方向、途中理解不同的人，是你把想法变成成果的方式。",strength:"你既能往远处看，也愿意为人与人之间搭一座桥。很多事情不是靠一个人的聪明完成，而是靠你把线索和伙伴连接起来。",caution:"当你替所有人协调时，自己的节奏可能被放到最后。不是每一段路，都必须由你先探明。",action:"把正在推动的事写成三句话：共同目标、各自负责的部分、下一次碰面的时间。",history:"张骞是西汉出使西域的使者，其经历与古代东西交通往来密切相关。",source:"《史记·大宛列传》；中国国家博物馆张骞通西域相关介绍",group:"求知与远行",direction:"11100110",vector:[82,68,82,32,32,82,68,32],anchors:[{dimension:"exploration",text:"出使西域的经历，让张骞常被视为通向未知的身影。"},{dimension:"connection",text:"使者的角色连接了不同的人与地域。"},{dimension:"initiative",text:"走向远方的行动，是这个原型最鲜明的线索。"}]},{id:"liqingzhao",name:"李清照",era:"宋代",line:"细腻，是你辨认世界的方式",title:"有主见的感受者",seal:"知",motif:"moon",tags:["细腻敏锐","独立表达","认真打磨"],intro:"你愿意认真对待一种感受，也不轻易把它交给别人的标准。那些看似微小的差别，对你来说都有自己的分量。",strength:"你擅长把模糊的心情变成准确的表达。独立判断与细致准备放在一起，会让你的作品和选择带着清楚的个人印记。",caution:"敏锐也会让你反复回看不够理想的细节。允许一次表达只完成七分，余下的可以慢慢长出来。",action:"用自己的话记录今天一个细小的触动，不修饰，也不急着让别人认可。",history:"李清照是宋代词人。《金石录后序》也留下了她对收藏、生活与时代变化的记录。",source:"《漱玉词》；《金石录后序》",group:"诗意与表达",direction:"01011011",vector:[32,68,32,82,82,32,68,82],anchors:[{dimension:"autonomy",text:"李清照作品中鲜明的个人声音，是这个原型的重要来处。"},{dimension:"aesthetics",text:"词作对景物与细节的描写，带来细腻的审美联想。"},{dimension:"empathy",text:"我们借词作中的感怀，理解认真对待感受的这一面。"}]},{id:"fanzhongyan",name:"范仲淹",era:"北宋",line:"理想有分量，也要有落脚处",title:"把在意变成行动的人",seal:"行",motif:"branch",tags:["关心他人","心有方向","推动改变"],intro:"你希望事情能变好，而且不只对自己有利。对人的在意会推动你想办法，清楚的方向又能让这份热心落到行动里。",strength:"你能把“应该更好”拆成大家愿意一起做的事。你关心的不只是一个好点子，也包括它能不能真正改善某些人的处境。",caution:"当你把许多人的期待都放在心里，责任容易越接越多。把“我愿意做”与“必须由我做”分开，会更长久。",action:"从你关心的问题里选一个，把本周能完成的最小改变写下来，并找一个同行的人。",history:"范仲淹是北宋政治家、文学家，《岳阳楼记》是其代表作之一。",source:"《范文正公集》；《岳阳楼记》",group:"行动与担当",direction:"11101110",vector:[68,82,82,32,82,68,68,32],anchors:[{dimension:"empathy",text:"《岳阳楼记》中的家国关切，提供了对他人处境的联想。"},{dimension:"planning",text:"治理与公共事务的经历，让理想与安排在这个原型中相连。"},{dimension:"initiative",text:"这个原型强调把在意推进为实际的改变。"}]},{id:"banzhao",name:"班昭",era:"东汉",line:"安静做完的事，也有很长的回声",title:"耐心的梳理者",seal:"续",motif:"branch",tags:["专注可靠","尊重事实","独立深耕"],intro:"你不一定需要站在最热闹的位置，却在意事情有没有被认真完成。梳理、核对、补上缺口，会让你感到踏实。",strength:"你能在复杂和琐碎里守住线索。那些需要时间积累的工作，常常因为你愿意持续投入，才慢慢变得清晰。",caution:"可靠不意味着凡事都要独自兜底。把完成标准说清楚，也给自己一个可以停下来的位置。",action:"为一件反复打磨的事写下“做到这里就可以交付”的三条标准。",history:"班昭是东汉学者，曾参与《汉书》的续修，也留下了文章与赋作。",source:"《后汉书·列女传·曹世叔妻》；《汉书》编纂相关记载",group:"求知与远行",direction:"01000100",vector:[32,82,32,32,32,82,18,32],anchors:[{dimension:"planning",text:"续修《汉书》的工作，需要长期梳理与承接。"},{dimension:"connection",text:"知识的接续，也发生在人与人之间。"},{dimension:"expression",text:"含蓄、耐心的记录，是我们选择的文化阅读角度。"}]},{id:"zhugeliang",name:"诸葛亮",era:"三国",line:"你让复杂的事，慢慢有了章法",title:"稳稳托住局面的人",seal:"定",motif:"mountain",tags:["思路周全","重视责任","协作有序"],intro:"面对一团乱麻，你习惯先分清轻重缓急。你希望计划有依据、协作有安排，也希望交到手上的事有一个可靠的结果。",strength:"你能把零散的力量组织起来。别人感到安心，往往不是因为你说了多少保证，而是因为你真的想过下一步。",caution:"习惯提前考虑问题，容易让你把别人的责任也揽过来。留一点空白给伙伴发挥，并不会削弱你的可靠。",action:"列出当前任务里只有你能做的一件事，把另一件清楚地交还给它的负责人。",history:"诸葛亮是三国时期蜀汉政治家。《三国志》记载了其治理与辅政经历。",source:"《三国志·蜀书·诸葛亮传》",group:"行动与担当",direction:"01110100",vector:[32,82,82,68,32,82,32,32],anchors:[{dimension:"planning",text:"诸葛亮的谋划形象，为这个原型提供了章法与秩序感。"},{dimension:"connection",text:"协调人与事，是其后世文化形象的重要部分。"},{dimension:"initiative",text:"计划需要在现实中推进，这构成了这个原型的另一面。"}]},{id:"taoyuanming",name:"陶渊明",era:"东晋",line:"把日子过成自己愿意靠近的样子",title:"守住本心的生活家",seal:"归",motif:"branch",tags:["内在清楚","珍惜日常","有自己的节奏"],intro:"比起追上所有人的期待，你更在意自己的生活是不是顺心。你愿意慢一点，把值得珍惜的人、物与习惯照顾好。",strength:"你能分辨热闹与需要之间的距离。愿意做减法，让你有机会把时间真正留给重要的东西。",caution:"守住边界并不意味着必须拒绝变化。可以保留一块安稳的日常，再为新体验留一个小入口。",action:"为这周删去一件并非真心想做的事，把时间还给一个你喜欢的日常。",history:"陶渊明是东晋诗人，《归园田居》等作品描写了田园生活与个人志趣。",source:"《陶渊明集》；《归园田居》",group:"诗意与表达",direction:"00011001",vector:[32,32,32,82,68,18,32,82],anchors:[{dimension:"autonomy",text:"归田与田园书写，让陶渊明常与自择生活的形象相连。"},{dimension:"aesthetics",text:"日常景物在其诗文中拥有自己的意味。"},{dimension:"connection",text:"我们借较安静的田园形象，联想给自己留空间的偏好。"}]},{id:"mengmu",name:"孟母",era:"先秦史传形象",line:"你给出的安稳，常常很有力量",title:"把支持放进日常的人",seal:"育",motif:"branch",tags:["耐心陪伴","体贴周全","看重长久"],intro:"你留意一个人需要怎样的环境，也愿意把关心落实为日常安排。对你来说，重要的关系值得慢慢经营。",strength:"你擅长提供可以持续的支持。一次认真倾听、一件提前准备的小事，都可能成为别人敢于向前走的底气。",caution:"照顾不等于替别人选择。把支持与代劳分开，也别忘了给自己的需要留一个位置。",action:"对一个重要的人问一句：这件事上，你希望我陪你、帮忙，还是给你一点空间？",history:"孟母的故事主要见于古代史传与教育叙事。本报告借用其中重视环境与陪伴的一面。",source:"刘向《列女传·母仪传·邹孟轲母》；史传形象不等同于完整生平",group:"相处与守护",direction:"01101100",vector:[32,82,68,32,82,82,32,32],anchors:[{dimension:"empathy",text:"孟母故事的文化核心，在于对成长与环境的关切。"},{dimension:"planning",text:"迁居与教养故事常被后世读作对日常环境的认真安排。"},{dimension:"connection",text:"这个原型关注人在关系里得到怎样的支持。"}]},{id:"xuxiake",name:"徐霞客",era:"明代",line:"先去看一看，世界会给你新线索",title:"亲自求证的探索者",seal:"探",motif:"mountain",tags:["行动好奇","独立判断","重视见闻"],intro:"遇到一个问题，你更愿意亲自试一试、看一看。计划可以边走边调，但自己的观察和判断不能轻易省略。",strength:"你能把好奇心带到现实里。愿意走近细节，常会让你发现别人从远处看不到的线索。",caution:"不断往前探索时，整理和休息可能被留到以后。把发现记下来，才能让走过的路真正变成自己的积累。",action:"去观察一个熟悉却没细看的地方，记下三个具体发现，不急着下结论。",history:"徐霞客是明代旅行家、地理学家，其考察记录汇成《徐霞客游记》。",source:"《徐霞客游记》；中国国家博物馆馆藏介绍",group:"求知与远行",direction:"10110001",vector:[82,32,82,82,32,32,32,68],anchors:[{dimension:"exploration",text:"《徐霞客游记》留下了走向不同山川的观察。"},{dimension:"initiative",text:"亲自出发与记录，让探索成为具体行动。"},{dimension:"autonomy",text:"我们借旅行者的形象，理解独立寻找路径的偏好。"}]},{id:"sushi",name:"苏轼",era:"北宋",line:"风向变了，你也能把日子接住",title:"通透的转弯者",seal:"旷",motif:"water",tags:["灵活开阔","善于交流","愿意尝试"],intro:"现实未必照着计划来，你会试着换一个角度继续走。你愿意接触新东西，也愿意和身边的人一起把问题说清楚。",strength:"你能让局面重新流动起来。一个新的理解、一场轻松却认真的讨论，都可能让原本卡住的事情有了出口。",caution:"能转弯不代表没有失落。不要急着把每一次难处都讲得轻松，认真承认它，再选择下一步。",action:"把一个最近的难题换一种问法：现在仍然可以做成的一小件事是什么？",history:"苏轼是北宋文学家、书画家，其诗文留下了丰富的生活经验与思考。",source:"《东坡集》；《前赤壁赋》等作品；此处为原创文化联想",group:"诗意与表达",direction:"10101111",vector:[82,32,68,32,68,82,82,68],anchors:[{dimension:"exploration",text:"苏轼丰富的生活书写，给人开放观看世界的联想。"},{dimension:"expression",text:"诗文中的鲜明表达，是这个文化原型的显著线索。"},{dimension:"connection",text:"唱和、交往与日常文字，提供了人与人相遇的阅读角度。"}]},{id:"libai",name:"李白",era:"唐代",line:"给热爱一点空间，它会带你向前",title:"自由的灵感行动者",seal:"逸",motif:"moon",tags:["感受鲜明","敢于尝试","保有自我"],intro:"有些事还没完全想清楚，你已经能感到它值得一试。你珍惜真实的兴致，也希望做出的选择带着自己的声音。",strength:"你能把感受变成行动的起点。热情与独立放在一起，会让熟悉的生活偶尔闪出一条新的路。",caution:"灵感来得快，收尾却需要另一种耐心。为喜欢的事留一个小而固定的行动，比等待下次心动更可靠。",action:"选一个最近让你兴奋的想法，今天只做一个看得见的片段。",history:"李白是唐代诗人，其诗歌中的想象力与自由气息形成了鲜明的文学形象。",source:"《李太白集》；人物联想取自文学形象的一面",group:"诗意与表达",direction:"10110111",vector:[82,32,68,82,32,68,82,68],anchors:[{dimension:"autonomy",text:"李白诗歌的自由气息，是这个原型的一个来处。"},{dimension:"expression",text:"鲜明的想象与表达，让感受有了自己的声音。"},{dimension:"exploration",text:"诗歌中的远游意象，带来向外探索的文化联想。"}]},{id:"wangzhaojun",name:"王昭君",era:"西汉",line:"不同的世界之间，也可以有理解",title:"温柔而有勇气的连接者",seal:"和",motif:"water",tags:["愿意靠近","开放共感","适应变化"],intro:"陌生并不会自动让你退后。你愿意先去理解不同的人，在相处与变化中找到一种可以继续往前走的方式。",strength:"你能在差异之间发现共同点。愿意倾听，也愿意尝试新的相处方式，让你有机会连接原本不太相通的两端。",caution:"理解别人，不等于把自己的需要放轻。温柔的连接里，同样可以有清楚的边界。",action:"在一次交流里，先复述对方的意思，再清楚说出你自己也在意的一点。",history:"王昭君是汉代和亲历史人物，其出塞故事也成为后世诗歌与艺术的题材。",source:"《汉书·匈奴传》；昭君出塞相关历史与文学记载",group:"相处与守护",direction:"10001101",vector:[82,32,32,32,82,82,32,68],anchors:[{dimension:"connection",text:"昭君出塞常被后世作为不同地域相连的文化题材。"},{dimension:"empathy",text:"这个原型选择理解差异、认真对待他人的阅读角度。"},{dimension:"exploration",text:"走向不同环境，为这个原型带来开放的一面。"}]},{id:"wangzhenyi",name:"王贞仪",era:"清代",line:"不急着相信，认真把事情看明白",title:"清醒的实践者",seal:"明",motif:"moon",tags:["独立求知","务实观察","认真核对"],intro:"你愿意面对眼前的真实情况，再用自己的办法弄明白它。比起声势很大的说法，清楚、有用的认识更能让你安心。",strength:"你能把复杂问题带回可以观察和解释的层面。这种独立与耐心，会让已有的知识和做法变得更扎实。",caution:"不必等到自己全懂了才开始交流。把一个尚未完成的疑问说出来，也可能得到很有价值的回应。",action:"挑一个最近听到的说法，找到它的出处，并用自己的话解释给自己听。",history:"王贞仪是清代学者，涉猎天文、数学与诗歌，留下了相关论述和作品。",source:"王贞仪《德风亭初集》及天文、数学著述相关研究",group:"求知与远行",direction:"11010010",vector:[82,82,32,82,32,32,68,32],anchors:[{dimension:"exploration",text:"天文与数学著述，为王贞仪提供了广泛求知的线索。"},{dimension:"autonomy",text:"我们借独立研习的形象，理解保留自身判断的偏好。"},{dimension:"planning",text:"认真解释与梳理知识，是这个原型的重要侧面。"}]},{id:"xianfuren",name:"冼夫人",era:"梁陈隋时期",line:"需要有人站出来时，你愿意接住现实",title:"临事有度的守护者",seal:"安",motif:"mountain",tags:["务实果断","重视协作","守护安稳"],intro:"事情发生时，你会先看清现实条件，再让大家有序地行动。对你来说，稳定不是一动不动，而是有能力应对变化。",strength:"你能在复杂的人与事之间找到眼下可行的路。愿意承担，也愿意协调，让你的力量常常落在很具体的地方。",caution:"总在处理眼前的事，可能会忘记问自己是否已经疲惫。把责任分出去，也是让局面更稳的一部分。",action:"把一件正在独自承担的事拆成两部分，邀请合适的人共同完成其中一部分。",history:"冼夫人是岭南历史人物，其经历与地方安定、不同群体之间的协调有关。",source:"《隋书·列女传·谯国夫人》；国家民委冼夫人故里介绍",group:"相处与守护",direction:"01100110",vector:[32,82,82,32,32,82,68,32],anchors:[{dimension:"initiative",text:"地方事务中的行动形象，为这个原型提供了务实的一面。"},{dimension:"connection",text:"不同群体之间的协调，是冼夫人相关史实的重要线索。"},{dimension:"planning",text:"面对复杂局面时处理秩序，是这里选择的文化联想。"}]},{id:"xuetao",name:"薛涛",era:"唐代",line:"平常的日子，也值得有自己的光",title:"敏锐的日常创作者",seal:"笺",motif:"branch",tags:["独立细腻","珍惜日常","随时感受"],intro:"你会被很小的事打动，也愿意按自己的方式回应它。比起宏大的安排，一段真实的体验常常更能唤起你的表达。",strength:"你能从普通生活里发现值得留下的细节。细腻的感受与独立的声音，让日常也有机会成为作品。",caution:"把喜欢的东西一直留在心里，别人可能就没有机会理解它。不必解释得完美，可以先分享一点。",action:"用一句话、一张照片或一个小动作，留下今天最想珍惜的瞬间。",history:"薛涛是唐代诗人，她的诗歌与蜀地文化、诗人交往和日常景物相联系。",source:"《全唐诗》薛涛诗；成都望江楼相关文化介绍",group:"诗意与表达",direction:"00110011",vector:[32,32,68,82,32,32,82,82],anchors:[{dimension:"aesthetics",text:"薛涛诗歌与蜀地文化，让日常景物带有创作的意味。"},{dimension:"expression",text:"诗作提供了独特而具体的表达线索。"},{dimension:"autonomy",text:"我们选择个人声音与独立打磨这一侧来阅读她的文化形象。"}]},{id:"caiwenji",name:"蔡文姬",era:"东汉末年",line:"经历会留下痕迹，也能留下理解",title:"有韧性的倾听者",seal:"韧",motif:"water",tags:["体会深切","珍惜关系","柔中有韧"],intro:"变化之中，你仍然在意人与人有没有被认真对待。你愿意倾听，也能从细小的联系里找回继续生活的力量。",strength:"你能把经历变成理解，而不只是一个急着给出的结论。你提供的支持，常常来自愿意陪人把一段话说完。",caution:"感受得到别人的重量，不代表必须全部背在身上。关心与休息可以同时存在。",action:"为自己留十分钟不处理任何人的请求，写下此刻最需要的一件小事。",history:"蔡琰，字文姬，是东汉末年文学人物，《后汉书》记载了她的经历与诗作。",source:"《后汉书·列女传·董祀妻》；本报告不推断历史人物的真实心理类型",group:"相处与守护",direction:"00001111",vector:[32,32,32,32,82,82,82,68],anchors:[{dimension:"empathy",text:"蔡琰相关记载及作品，使这个原型重视经历与感受。"},{dimension:"connection",text:"这个文化阅读角度关注人与人之间的牵挂。"},{dimension:"expression",text:"文字可以让难以直接说出的经历得到表达。"}]},{id:"simaqian",name:"司马迁",era:"西汉",title:"有耐心的真相记录者",line:"你愿意把复杂的故事，认真讲完",seal:"史",motif:"mountain",tags:["独立求证","长线耐心","理解人间"],intro:"你愿意让一件事拥有它完整的来龙去脉。比起立刻站队，你更想弄清：它如何发生，身在其中的人又经历了什么。",strength:"你能把零散的片段整理成有分量的理解。独立判断与对人的体会，让你的表达不仅有观点，也有背景。",caution:"一直追问“还差什么”，有时会让完成变得遥远。可以先交出清楚的一段，之后再续写。",action:"把一件常被简单评价的事，写成三个不同当事人的视角。",history:"司马迁撰写《史记》，以纪传体叙述历史，也记录众多不同身份的人物。",source:"《史记》；《报任安书》",group:"求知与远行",direction:"01011010",vector:[32,82,32,82,82,32,68,32],anchors:[{dimension:"planning",text:"《史记》的篇章组织，为这个原型提供了长线梳理的线索。"},{dimension:"autonomy",text:"独立记录与判断，是我们选择的文化阅读角度。"},{dimension:"empathy",text:"众多人物的具体经历，让历史不只是一个结论。"}]},{id:"lishizhen",name:"李时珍",era:"明代",title:"把问题追到底的实践者",line:"答案不够清楚，就再走近一点",seal:"证",motif:"branch",tags:["细致求证","动手验证","耐心积累"],intro:"你习惯把一个看起来合理的说法，带回具体的材料和现场。新鲜感让你出发，耐心让你把细节补全。",strength:"你能让好奇变得有用。观察、对照、动手确认，这些不声张的步骤常常决定事情最后是否扎实。",caution:"不是每个细节都需要在今天解决。先分清影响结果的疑问和暂时可以放下的疑问。",action:"找一个日常小困扰，记录三次实际情况，再试着改一个变量。",history:"李时珍编撰《本草纲目》，对本草知识作了广泛整理与考辨。",source:"《本草纲目》",group:"求知与远行",direction:"11110000",vector:[82,82,82,68,32,32,32,32],anchors:[{dimension:"exploration",text:"本草知识的考辨，需要持续走近新的材料和疑问。"},{dimension:"planning",text:"整理、对照与分类，是《本草纲目》给予这个原型的线索。"},{dimension:"initiative",text:"这个原型重视把疑问带进实际观察。"}]},{id:"zhenghe",name:"郑和",era:"明代",title:"让远方变得可抵达的人",line:"心里有远方，手里也有准备",seal:"航",motif:"water",tags:["有序探索","重视协作","稳步推进"],intro:"你会被远处的可能吸引，也愿意为到达那里做细致准备。对你来说，真正的出发包括路线、资源和同路人。",strength:"你能把大目标变成可以一起执行的安排。既看方向，也处理途中需要衔接的人与事。",caution:"把所有细节都扛在自己身上，会让合作变成负担。清楚分工，比事事亲自过问更有用。",action:"为一件想做的大事，写下目的地、第一步和一个可以同行的人。",history:"郑和在明代率领船队多次远航，其活动与海上交流史相联系。",source:"《明史·郑和传》",group:"求知与远行",direction:"11100100",vector:[82,82,68,32,32,82,32,32],anchors:[{dimension:"exploration",text:"多次远航，为这个原型提供了走向远方的线索。"},{dimension:"planning",text:"船队远行也需要准备和组织。"},{dimension:"connection",text:"海上交流的历史背景，带来协作与联结的文化联想。"}]},{id:"wangwei",name:"王维",era:"唐代",title:"安静的生活观察者",line:"世界很大，你也有一处自己的留白",seal:"静",motif:"mountain",tags:["独处观照","细看日常","含蓄有度"],intro:"你不急着把每种感受都变成热闹。安静一点、看久一点，常常能发现别人匆匆经过时错过的东西。",strength:"你能给生活留下呼吸的空间。敏锐的观察不一定大声，却会影响你对环境、关系和作品的选择。",caution:"习惯安静，并不代表别人自然知道你的需要。重要的事，可以清楚说一次。",action:"找一处每天经过的地方，停留十分钟，只记录光线、声音和变化。",history:"王维是唐代诗人、画家，其山水田园诗具有鲜明的景物意境。",source:"《王右丞集》；王维山水田园诗",group:"诗意与表达",direction:"00010001",vector:[32,32,32,68,32,18,18,82],anchors:[{dimension:"aesthetics",text:"王维山水田园诗中的景物意境，是这个原型的主要来处。"},{dimension:"connection",text:"我们借较安静的观照形象，理解独处的偏好。"},{dimension:"expression",text:"含蓄与留白，是这里选择的表达阅读角度。"}]},{id:"xinqiji",name:"辛弃疾",era:"南宋",title:"有锋芒的行动表达者",line:"有些在意，值得站出来说清楚",seal:"锋",motif:"mountain",tags:["敢于行动","直率表达","心有方向"],intro:"你不太愿意把所有愿望都留在“以后再说”。一旦认定一件事值得，就希望说出来、试起来，让局面真的有一点变化。",strength:"你能把热情传递给行动。立场清楚的时候，别人也更容易知道该如何与你一起往前走。",caution:"行动很快时，也可能来不及听见别人的节奏。出发前多确认一句，能少一些无谓的摩擦。",action:"把最近最在意的一件事，写成一个本周可以实际完成的动作。",history:"辛弃疾是南宋词人，其词作中的抱负、感怀与时代关切构成鲜明特色。",source:"《稼轩长短句》",group:"行动与担当",direction:"10110110",vector:[68,32,82,82,32,68,82,32],anchors:[{dimension:"initiative",text:"其词作中的抱负，给这个原型带来行动的张力。"},{dimension:"expression",text:"鲜明而有力量的词风，是这个原型的阅读线索。"},{dimension:"autonomy",text:"我们取其清楚表达立场的文化形象。"}]},{id:"luyou",name:"陆游",era:"南宋",title:"热爱有回声的坚持者",line:"喜欢的事，值得认真做很久",seal:"恒",motif:"branch",tags:["持续投入","认真表达","情感有根"],intro:"你愿意为在意的事情反复投入。热情在你这里不只是最初的一阵风，也可以变成日复一日的记录和行动。",strength:"你能把情感放进长期的坚持。认真表达、认真生活，会让小小的积累慢慢有了自己的形状。",caution:"坚持不必等于一直用同一种办法。调整路径，也可以是在认真守护最初的心意。",action:"选一件想继续的小事，为它留一个轻松可执行的固定时段。",history:"陆游是南宋诗人，其作品兼有家国感怀与细密的日常生活书写。",source:"《剑南诗稿》；《放翁词》",group:"诗意与表达",direction:"01111011",vector:[32,82,68,68,82,32,82,68],anchors:[{dimension:"planning",text:"持续的诗文写作，让这个原型重视长期投入。"},{dimension:"expression",text:"大量作品提供了认真表达生活的线索。"},{dimension:"empathy",text:"日常与家国感怀，构成了这个原型对情意的重视。"}]},{id:"wangyangming",name:"王阳明",era:"明代",title:"让想法落地的自省者",line:"心里想明白，脚下也走一步",seal:"践",motif:"mountain",tags:["独立判断","自我反思","知行相接"],intro:"你希望想法和生活能对得上。理解一件事以后，还会想知道：放进今天的具体选择里，它究竟意味着什么。",strength:"你能把内在判断和实际行动接起来。既不轻易交出自己的标准，也愿意在实践里检验它。",caution:"标准太清楚时，容易给自己加重。允许理解和行动都从一个不完美的小版本开始。",action:"挑一条你认同的道理，今天只做一个与它一致的小动作。",history:"王守仁，世称王阳明，是明代思想家，其学说强调知与行的关联。",source:"《传习录》",group:"行动与担当",direction:"11111010",vector:[68,82,82,82,68,32,68,32],anchors:[{dimension:"initiative",text:"知与行的关联，是这个文化原型最直接的线索。"},{dimension:"autonomy",text:"内在判断与反思，是我们选择的阅读角度。"},{dimension:"planning",text:"让理解在生活里有落实的安排，是这里的现代联想。"}]},{id:"suwu",name:"苏武",era:"西汉",title:"安静而有定力的守持者",line:"慢一点也好，重要的东西没有松手",seal:"守",motif:"branch",tags:["自有准则","稳住节奏","少言笃定"],intro:"你不一定急着改变局面，但会认真分辨什么值得守住。周围声音多的时候，自己的准则能给你一个稳定的位置。",strength:"你能把耐心用在有分量的承诺上。清楚什么最重要，往往也能让你少受一时气氛的牵动。",caution:"守住原则，不必把所有困难都独自承受。找人商量方法，不会削弱你的坚持。",action:"写下一条对你重要的原则，再写一个更轻松地做到它的方法。",history:"《汉书》记载苏武出使匈奴及长期被留的经历，后世常以其作为持守的文化形象。",source:"《汉书·苏武传》",group:"行动与担当",direction:"01010000",vector:[32,82,32,82,32,32,18,32],anchors:[{dimension:"autonomy",text:"后世常以苏武作为持守自身准则的文化形象。"},{dimension:"planning",text:"这个原型借持久与稳定，理解较有定力的节奏。"},{dimension:"expression",text:"安静的持守，是这里选择的一种表达方式。"}]},{id:"huangdaopo",name:"黄道婆",era:"宋元之际",title:"把巧思变成日常帮助的人",line:"让生活变好，从一件具体的事开始",seal:"巧",motif:"branch",tags:["善于改进","动手落实","乐于分享"],intro:"你喜欢有用的新办法，也在意它能不能让身边的人省一点力。观察到一个不便，就会想试着把它改得更顺手。",strength:"你能把学习、动手和分享连起来。一个好办法不只解决自己的问题，也可能成为别人日常里的便利。",caution:"一直忙着帮人改善，可能会忽略自己也需要轻松。先把帮助的范围说清楚。",action:"把一个你熟悉的小技巧，整理成别人看一遍就能用的三步。",history:"黄道婆是中国纺织史上的重要人物，与棉纺织技术的改进和传播相联系。",source:"《南村辍耕录》相关记载；黄道婆纺织史资料",group:"相处与守护",direction:"11101100",vector:[68,68,82,32,82,82,32,32],anchors:[{dimension:"initiative",text:"纺织技术的改进与传播，为这个原型提供了动手的线索。"},{dimension:"connection",text:"可被更多人使用的技术，连接了个体与日常生活。"},{dimension:"empathy",text:"这个原型把关心放在减轻实际负担上。"}]},{id:"zhuowenjun",name:"卓文君",era:"西汉",title:"认真选择生活的勇敢者",line:"自己的日子，值得自己做主",seal:"择",motif:"water",tags:["忠于感受","主动选择","珍惜相伴"],intro:"你会认真听见自己的喜欢，也希望生活里的决定能保留这份真实。亲密与自主，在你这里不必互相取消。",strength:"你能让感受成为行动的理由。既愿意靠近重要的人，也愿意为想过的日子迈出自己的那一步。",caution:"热切的时候，也给现实条件留一个位置。把愿望和分工讲清楚，能让选择走得更长。",action:"为一个真正想要的生活细节做决定，同时写清它需要的时间和支持。",history:"《史记》记载卓文君与司马相如的故事，后世文学中常以其表达自主选择与情感主题。",source:"《史记·司马相如列传》；此处采用文化形象的一面",group:"相处与守护",direction:"00111101",vector:[32,32,82,82,82,68,32,68],anchors:[{dimension:"autonomy",text:"后世常借卓文君故事表达自择生活的主题。"},{dimension:"initiative",text:"我们选择主动回应心意的文化阅读角度。"},{dimension:"empathy",text:"情感与相伴，是这个原型的重要叙事线索。"}]},{id:"shangguanwaner",name:"上官婉儿",era:"唐代",title:"把才思放进局面的人",line:"话说得有分寸，也可以有锋芒",seal:"辞",motif:"moon",tags:["善用表达","注重章法","理解协作"],intro:"你能看见一句话放在不同场合会产生不同作用。整理内容、理解局面，再选择合适的表达，是你熟悉的方式。",strength:"你擅长把才思组织成别人能接住的内容。既重视表达的样子，也在意它能否推动实际交流。",caution:"顾及太多场合时，自己的声音可能被稀释。给真正想说的话留一个不必修饰的位置。",action:"把同一个想法分别写给自己和合作的人，看看哪一句是你真正想保留的。",history:"上官婉儿是唐代历史人物，与宫廷文书及诗歌创作相关。",source:"《旧唐书》相关记载；《全唐诗》上官婉儿诗",group:"行动与担当",direction:"01100111",vector:[32,82,68,32,32,82,82,68],anchors:[{dimension:"planning",text:"文书与篇章工作，让这个原型重视章法。"},{dimension:"expression",text:"诗歌和文书都让想法进入具体交流。"},{dimension:"connection",text:"宫廷文书的历史背景，为这个原型提供了理解场合的线索。"}]},{id:"guandaosheng",name:"管道昇",era:"元代",title:"把温柔放进笔墨的人",line:"认真经营的日常，也能长成作品",seal:"墨",motif:"branch",tags:["细致经营","重视关系","温柔审美"],intro:"你愿意花时间把日常照顾得更有意味。关系里的细节、作品里的气息，常常都来自这份耐心的经营。",strength:"你能把在意落实为稳定的投入。审美不是离生活很远的东西，也可以是一顿饭、一封信或一个认真完成的细节。",caution:"有时你会等所有人都安顿好，才轮到自己。把自己的喜欢也列进计划里。",action:"为自己安排一次很小的审美活动，并提前留出这段时间。",history:"管道昇是元代书画家、诗人，尤以墨竹等创作为人所知。",source:"管道昇书画作品及元代相关记载",group:"诗意与表达",direction:"01001101",vector:[32,82,32,32,82,68,32,82],anchors:[{dimension:"aesthetics",text:"墨竹与书画作品，是这个原型最直接的审美线索。"},{dimension:"planning",text:"细致打磨与日常经营，是这里选择的现代联想。"},{dimension:"empathy",text:"这个原型选择温柔而有分寸的文化阅读角度。"}]},{id:"xiedaoyun",name:"谢道韫",era:"东晋",title:"有自己比喻的灵思者",line:"同样的风景，你看见另一种说法",seal:"咏",motif:"moon",tags:["独立见解","灵动表达","善于联想"],intro:"别人已经给了一个答案，你还会想到另一种更贴切的说法。你喜欢联想，也在意自己的理解能否被准确表达。",strength:"你能让平常的交流忽然多一个新角度。表达不只是传递信息，也可以让大家重新看见熟悉的事情。",caution:"一个精彩的想法出现后，也给它一点安静打磨的时间，不必立刻证明自己。",action:"为今天一个普通的场景写一个属于自己的比喻，越具体越好。",history:"《世说新语》保存了谢道韫咏雪等故事，她也以才思敏捷的文化形象为人熟知。",source:"《世说新语·言语》；《晋书·列女传》",group:"诗意与表达",direction:"10010111",vector:[68,32,32,82,32,68,82,82],anchors:[{dimension:"expression",text:"咏雪故事中的比喻，提供了灵思表达的线索。"},{dimension:"autonomy",text:"与现成说法不同的回答，让这个原型保留独立见解。"},{dimension:"aesthetics",text:"把风景变成新的比喻，是这里的审美联想。"}]},{id:"qiujin",name:"秋瑾",era:"清末",title:"让理想有行动的人",line:"你想要的改变，可以从自己开始",seal:"醒",motif:"mountain",tags:["勇于开拓","坚定表达","关心他人"],intro:"你不太满足于“事情一直如此”。当一种不合理让你在意，你会想发出自己的声音，也会想做一点真正的改变。",strength:"你的热情常常带着明确的对象：某件事、某些人，或一种更好的可能。它能把独立判断和行动连接起来。",caution:"越是重要的理想，越需要可持续的节奏。为休息、协作和小步推进留位置。",action:"选一个你关心的议题，先完成一次阅读、一次清楚表达或一次具体帮助。",history:"秋瑾是清末革命者、诗人，也留下了与女性自主等主题相关的文字。",source:"《秋瑾集》；秋瑾纪念馆相关资料",group:"行动与担当",direction:"1011
